services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: arinc429
      MYSQL_USER: arinc
      MYSQL_PASSWORD: arinc_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
