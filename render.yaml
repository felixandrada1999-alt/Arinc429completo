services:
  - type: web
    name: arinc429-crud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arinc429-db
          property: connectionString
      - key: SERIAL_ENABLED
        value: "false"

databases:
  - name: arinc429-db
    databaseName: arinc429
    user: arinc
    plan: free